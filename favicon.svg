<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="llGold" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9E7F47" />
      <stop offset="35%" stop-color="#C5A46D" />
      <stop offset="70%" stop-color="#E5D1AA" />
      <stop offset="100%" stop-color="#C5A46D" />
    </linearGradient>
    <linearGradient id="llEmerald" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B3D2E" />
      <stop offset="100%" stop-color="#051C15" />
    </linearGradient>
  </defs>
  
  <!-- Outer Obsidian Badge -->
  <rect width="64" height="64" rx="14" fill="#111111" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#llGold)" stroke-width="1.2" stroke-opacity="0.6" />
  
  <!-- Inner Subtle Emerald Layer -->
  <rect x="5" y="5" width="54" height="54" rx="10" fill="url(#llEmerald)" fill-opacity="0.75" />
  
  <!-- Intertwined Architectural Luxe Living Monogram L & L -->
  <g stroke="url(#llGold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- First 'L' - Architectural upright & horizontal plinth -->
    <path d="M22 17V45H39" />
    <!-- Second 'L' - Offset mirrored & elevated -->
    <path d="M28 23V39H44" />
    <!-- Diamond luxury accent -->
    <polygon points="32,15 35,19 32,23 29,19" fill="url(#llGold)" stroke-width="0.8" />
  </g>
</svg>
